# cargo-deny policy: `cargo deny check`
[graph]
all-features = true

[advisories]
# RUSTSEC advisories fail the build; add `ignore = ["RUSTSEC-..."]` entries with a justification.
ignore = [
    # chrono is unmaintained. Kept by choice (2026-11-18): Tortuga uses it for ISO
    # timestamps and the local UTC offset, and rmcp (the MCP server) requires it
    # anyway. Revisit when rmcp drops chrono.
    { id = "RUSTSEC-2026-0543", reason = "chrono kept by choice; rmcp requires it too" },
]
# Only fail on unmaintained crates we depend on directly; transitive ones come from
# eframe/winit/GTK and are tracked upstream.
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  # Windows clipboard support in eframe (clipboard-win, error-code).
  "BSL-1.0",
  # File watching (notify): a public-domain dedication, no conditions.
  "CC0-1.0",
  # Fonts bundled with egui (epaint_default_fonts): may be embedded in any app.
  "OFL-1.1",
  "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
