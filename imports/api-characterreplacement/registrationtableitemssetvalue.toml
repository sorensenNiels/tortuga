name = "registrationTableItemsSetValue"
seq = 1700
method = "POST"
server = "synchservicesbase"
url = "/apixml"

[auth]
kind = "basic"
username = "{{username_2}}"
password = "{{password_2}}"

[body]
kind = "xml"
content = """
      <syn:registrationTableItemsSetValues registrationSequence="{{CharacterCheckRegistration}}" table="FEJL" xmlns:syn="http://www.synchronicer.dk">\r
         <syn:row rowId="{{CharacterCheckRow}}">\r
            <syn:itemValue item="FEJLBE" value="ABC X ABC"/>\r
            <syn:itemValue item="FEJLVJ" value="Dyssegårdsvej"/>\r
         </syn:row>\r
      </syn:registrationTableItemsSetValues>"""

[scripts]
tests = """
// Translated from Postman's `pm` API by the import: check that it tests what it did.
test("Status code is 200", function () {
    expect(res.status).toBe(200);
});
if (res.status == 200){
    test("status", function(){
        var jsonObject;
        jsonObject = xml2Json(res.body);
        var status = jsonObject.registrationTableItemsSetValuesResponse.$.status;
        if (status != "success") {
            workflow.stop();
        }
        expect(status).toBe("success");
    })
} else {
    workflow.stop();
}
"""
