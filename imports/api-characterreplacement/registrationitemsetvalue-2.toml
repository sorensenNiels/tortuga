name = "registrationItemSetValue 2"
seq = 800
method = "POST"
server = "synchservicesbase"
url = "/apixml"

[auth]
kind = "basic"
username = "{{username_2}}"
password = "{{password_2}}"

[body]
kind = "xml"
content = """
      <syn:registrationItemSetValue registrationSequence="{{CharacterCheckRegistration}}" item="BESKED" value="ABC ' ABC" xmlns:syn="http://www.synchronicer.dk">\r
      </syn:registrationItemSetValue>"""

[scripts]
tests = """
// Translated from Postman's `pm` API by the import: check that it tests what it did.
test("Status code is 200", function () {
    expect(res.status).toBe(200);
});
if (res.status == 200){
    test("status", function(){
        var jsonObject;
        jsonObject = xml2Json(res.body);
        var status = jsonObject.registrationItemSetValueResponse.$.status;
        if (status != "success") {
            workflow.stop();
        }
        expect(status).toBe("success");
    })
} else {
    workflow.stop();
}
"""
