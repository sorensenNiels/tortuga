[package]
name = "tortuga-app"
description = "Tortuga desktop (and later web) application: launches the egui UI from tortuga-ui-egui."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "tortuga"
path = "src/main.rs"

[dependencies]
tortuga-core.workspace = true
tortuga-ui-egui.workspace = true
eframe.workspace = true
serde.workspace = true

# Desktop-only: async runtime for sending requests, settings on disk, native file dialogs.
tokio = { workspace = true, optional = true }
directories = { workspace = true, optional = true }
keyring = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
gix = { workspace = true, optional = true }
open = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

# GTK backend on Linux: the xdg-desktop-portal backend fails silently where no portal runs (e.g. WSL).
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { workspace = true, optional = true, features = ["gtk3"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { workspace = true, optional = true }

# Web-only: run futures in the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true, optional = true }

[build-dependencies]
winresource.workspace = true

[features]
default = ["desktop"]
desktop = ["dep:tokio", "dep:rfd", "dep:directories", "dep:toml", "dep:keyring", "dep:notify", "dep:gix", "dep:open", "dep:serde_json", "dep:chrono"]
web = ["dep:wasm-bindgen-futures"]

[lints]
workspace = true

# Installers (R-NF-4), built with cargo-packager: `make package` (see docs/RELEASING.md).
[package.metadata.packager]
product-name = "Tortuga"
identifier = "dk.softdesign.tortuga"
description = "A fast, git-friendly API client"
long-description = "Tortuga is an API client for developers. Requests, environments and servers are plain TOML files that teams share through git, next to the code."
homepage = "https://github.com/sorensenNiels/tortuga"
category = "DeveloperTool"
license-file = "../../LICENSE-MIT"
icons = ["icons/32.png", "icons/64.png", "icons/128.png", "icons/256.png", "icons/512.png", "icons/tortuga.ico"]
out-dir = "../../target/packages"
binaries = [{ path = "tortuga", main = true }]

[package.metadata.packager.deb]
# GTK for file dialogs; X11 keyboard and OpenGL/EGL are loaded at run time; D-Bus for the credential store.
depends = ["libgtk-3-0", "libxkbcommon-x11-0", "libegl1", "libgl1", "libdbus-1-3"]
section = "devel"

[package.metadata.packager.appimage]
# Loaded at run time by the window library on X11, and missing on some minimal systems.
libs = ["libxkbcommon-x11.so.0"]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
