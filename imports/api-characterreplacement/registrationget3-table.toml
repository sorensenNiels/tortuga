name = "registrationGet3 Table"
seq = 2000
method = "POST"
server = "synchservicesbase"
url = "/apixml"

[auth]
kind = "basic"
username = "{{username_2}}"
password = "{{password_2}}"

[body]
kind = "xml"
content = '<syn:registrationGet registrationSequence="{{CharacterCheckRegistration}}" xmlns:syn="http://www.synchronicer.dk"/>'

[scripts]
tests = """
// Translated from Postman's `pm` API by the import: check that it tests what it did.
test("Status code is 200", function () {
    expect(res.status).toBe(200);
});
if (res.status == 200){
    test("status", function(){
        var jsonObject;
        jsonObject = xml2Json(res.body);
        var status = jsonObject.registrationGetResponse.$.status;
        if (status != "success") {
            workflow.stop();
        }
        expect(status).toBe("success");
        
        var len = jsonObject.registrationGetResponse.registration.table.length;
        for (i = 0; i < len; i++){
            var table = jsonObject.registrationGetResponse.registration.table[i].$.table;
            if (table == "FEJL"){
                var len2 = jsonObject.registrationGetResponse.registration.table[i].row.length;
                for (j = 0; j < len2; j++){
                    var rowid = jsonObject.registrationGetResponse.registration.table[i].row[j].$.rowId;
                    if (rowid == vars.get("CharacterCheckRow")){
                        var len3 = jsonObject.registrationGetResponse.registration.table[i].row[j].itemValue.length;
                        for (k = 0; k < len3; k++){
                            var item2 = jsonObject.registrationGetResponse.registration.table[i].row[j].itemValue[k].$.item;
                            var val2 = jsonObject.registrationGetResponse.registration.table[i].row[j].itemValue[k].$.value;
                            if (item2 == "FEJLTP"){
                                expect(val2).toBe("MSM");
                            }
                            if (item2 == "FEJLBE") {
                                expect(val2).toBe("ABC ? ABC");
                            }
                            if (item2 == "FEJLHN") {
                                expect(val2).toBe("2");
                            }
                            if (item2 == "FEJLVJ") {
                                expect(val2).toBe("Dyssegårdsvej");
                            }
                            if (item2 == "FEJLPB") {
                                expect(val2).toBe("2870");
                            }
                        }
                    }
                }
            }
        }
    })
} else {
    workflow.stop();
}
"""
