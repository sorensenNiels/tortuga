[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/tortuga-core"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Niels P. Sørensen <niels.p.sorensen@softdesign.dk>"]

[workspace.dependencies]
tortuga-core = { path = "crates/tortuga-core" }
tortuga-ui-egui = { path = "crates/tortuga-ui-egui" }

# Bundled fonts, including the emoji fonts that hold the symbols the UI uses (⏵ ⏺ ⚠ 🗙 ⚙ …).
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
# OpenGL (glow) instead of the default wgpu: smaller, faster to build, and works under WSLg.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "wayland", "x11"] }
# Rendered Markdown for descriptions (R-COL-22); no images, so nothing is loaded from the network.
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "charset", "gzip", "brotli", "deflate", "system-proxy", "cookies", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
percent-encoding = "2"
base64 = "0.23"
# Cookie jars (R-CK-1); the same version reqwest uses.
cookie_store = "0.22"
thiserror = "2"
url = { version = "2", features = ["serde"] }
web-time = "1"
toml = "1"
# Native file dialogs. Linux uses the GTK backend (see tortuga-app dialogs.rs).
rfd = { version = "0.17", default-features = false }
directories = "6"
# OS credential store for secret variables (R-LOC-2): Keychain, Credential Manager, Secret Service.
keyring = "4.2"
# Live git collaboration (M6): file watching (debounced in tortuga-app watch.rs), git status without a git executable, opening folders.
notify = "8.2"
gix = { version = "0.89", default-features = false, features = ["status", "sha1", "max-performance-safe"] }
open = "5"
# The local UTC offset, to show history times (R-HIST-2).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
wasm-bindgen-futures = "0.4"
# JavaScript for pre-request and test scripts (R-TEST-3, D24): pure Rust, sandboxed.
boa_engine = { version = "0.22", default-features = false }
# OpenAPI descriptions in YAML (R-COL-15): pure Rust, read into serde_json values.
yaml-rust2 = { version = "0.13", default-features = false }
# XML bodies, pretty-printing and XPath (R-HTTP-19): pure Rust, already used by the Wayland build.
quick-xml = "0.41"
# Decoding image responses to show them (R-HTTP-17): pure Rust, also on wasm; the common web formats only.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
# The mock server (R-MOCK-2, D46): native only; the versions reqwest already uses.
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
# Windows icon and version information in tortuga.exe (build script).
winresource = { version = "0.1", default-features = false }

# dev / test
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
egui_kittest = "0.37"
wiremock = "0.6"
tempfile = "3"
# A small HTTPS server for the CA certificate test (R-HTTP-16); the versions reqwest uses.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
rustls-pki-types = { version = "1", features = ["std"] }

[workspace.lints.rust]
# `deny` (not `forbid`) so a single, justified spot could opt out with `#[expect(unsafe_code)]`.
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are more noise than signal for this project.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
# Beyond pedantic: cheap `Arc` clones read differently from deep ones; locks and other
# guards are dropped as soon as possible; no `&mut` that is never used mutably.
clone_on_ref_ptr = "warn"
significant_drop_tightening = "warn"
needless_pass_by_ref_mut = "warn"
derive_partial_eq_without_eq = "warn"
# Library code returns errors; only the binaries print (see CLAUDE.md "Code quality").
print_stdout = "warn"
print_stderr = "warn"

[profile.dev]
# Faster incremental builds; dependencies still optimised a bit for a snappy UI.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
