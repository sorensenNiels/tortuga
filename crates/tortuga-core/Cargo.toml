[package]
name = "tortuga-core"
description = "UI-agnostic engine for Tortuga: request model, HTTP execution, collections, environments."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
percent-encoding.workspace = true
base64.workspace = true
thiserror.workspace = true
url.workspace = true
toml.workspace = true
# `std::time::Instant` panics on wasm32; this is a drop-in that works everywhere.
web-time.workspace = true
# Dynamic variables (R-VAR-8): random values and ISO timestamps.
rand.workspace = true
chrono.workspace = true
# The `X-Tortuga-Token` header (R-HTTP-23).
cuid2.workspace = true
# Cookie jars (R-CK-1).
cookie_store.workspace = true
# Pre-request and test scripts (R-TEST-3).
boa_engine.workspace = true
# OpenAPI import (R-COL-15).
yaml-rust2.workspace = true
# XML bodies and XPath (R-HTTP-19).
quick-xml.workspace = true

# The mock server's listener (R-MOCK-2, D46); core logic stays runtime-free.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
# Where a send's time went (R-HTTP-25): a timed connector layer and a task-local.
tower.workspace = true
tokio = { workspace = true, features = ["net", "time", "sync", "rt"] }

# `time` needs the browser clock on wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
cookie_store = { workspace = true, features = ["wasm-bindgen"] }
# Boa's clock and random numbers come from the browser on wasm32.
boa_engine = { workspace = true, features = ["js"] }

[dev-dependencies]
tokio.workspace = true
wiremock.workspace = true
cuid2.workspace = true
tempfile.workspace = true
tokio-rustls.workspace = true
rustls-pki-types.workspace = true

[lints]
workspace = true
